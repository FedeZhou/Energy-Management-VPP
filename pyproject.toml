[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emsbench"
version = "0.0.1"
description = "Generic site energy management simulator and honest controller benchmark under forecast error."
readme = "README.md"
license = "MIT"
# CityLearn 3.2.0 pins scikit-learn<=1.2.2, which has no wheels for Python 3.12+.
# Python 3.11 is supported upstream until Oct 2027.
requires-python = ">=3.11,<3.12"
dependencies = [
    "citylearn==3.2.0",
    "numpy<2",
    "pandas",
    "tabulate",  # pandas.DataFrame.to_markdown
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Lets Python use the operating system's certificate store. Needed on
    # machines where antivirus or a proxy re-signs HTTPS traffic.
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "httpx"]

[project.scripts]
emsbench-baseline = "emsbench.baseline:main"
emsbench-app = "emsbench.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo lives in OneDrive, which locks files mid-sync and breaks pytest's cache.
addopts = "-p no:cacheprovider"
markers = ["integration: runs real CityLearn episodes (needs cached or downloadable data)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
