<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Lab</title>
    <script>
      // Apply the saved theme before the first paint (no flash); src/theme.ts takes over from here.
      try {
        var t = localStorage.getItem("sitelab.theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var m = /(^|[#-])(dark|light)($|-)/.exec(location.hash);
        if (m) t = m[2];
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3Eg%7Bfill:%23111%7D@media(prefers-color-scheme:dark)%7Bg%7Bfill:%23f2f2f0%7D%7D%3C/style%3E%3Cg%3E%3Crect x='1.5' y='8' width='3' height='7'/%3E%3Crect x='6.5' y='2' width='3' height='13'/%3E%3Crect x='11.5' y='5' width='3' height='10'/%3E%3C/g%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
