<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ladder-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Battery models trade speed for physical detail</text><rect x="24" y="70" width="160" height="90" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="104.0" y="102.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Bucket</text><text x="104.0" y="119.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">energy in, energy out</text><text x="104.0" y="136.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">sizing, MILP</text><rect x="202" y="70" width="160" height="90" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="282.0" y="102.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Equivalent circuit</text><text x="282.0" y="119.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">OCV + R + RC</text><text x="282.0" y="136.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">BMS, control</text><rect x="380" y="70" width="160" height="90" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="460.0" y="102.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">SPM / SPMe</text><text x="460.0" y="119.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">one particle per electrode</text><text x="460.0" y="136.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">fast physics, ageing</text><rect x="558" y="70" width="160" height="90" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="638.0" y="102.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">DFN</text><text x="638.0" y="119.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">full transport in electrodes</text><text x="638.0" y="136.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">cell design, research</text><path d="M 40 200 L 720 200" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#ladder-ar-edge)"/><text x="40" y="222" font-size="11.5" fill="#5a5a5a">faster, fewer parameters</text><text x="720" y="222" font-size="11.5" text-anchor="end" fill="#5a5a5a">more detail, more parameters, slower</text><text x="24" y="248" font-size="11.5" fill="#5a5a5a" font-style="italic">Highlighted: the usual workhorse for estimation and control. Physics-informed ML sits across the ladder.</text></svg>