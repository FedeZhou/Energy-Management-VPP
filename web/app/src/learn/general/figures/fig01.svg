<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="TeX Gyre Heros" font-size="11"><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f3a5f"/></marker></defs>
<g fill="#f2f5f9" stroke="#1f3a5f" stroke-width="1">
<rect x="5" y="70" width="88" height="70" rx="6"/>
<rect x="118" y="70" width="98" height="70" rx="6"/>
<rect x="241" y="70" width="90" height="70" rx="6"/>
<rect x="356" y="70" width="88" height="70" rx="6"/>
</g>
<rect x="494" y="20" width="162" height="215" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.4"/>
<g fill="#1d1d1d" text-anchor="middle">
<text x="49" y="98" font-weight="bold">Generation</text><text x="49" y="114" font-size="9.5">plants, wind,</text><text x="49" y="126" font-size="9.5">solar farms</text>
<text x="167" y="98" font-weight="bold">Transmission</text><text x="167" y="114" font-size="9.5">high voltage</text><text x="167" y="126" font-size="9.5">TSO (TenneT)</text>
<text x="286" y="98" font-weight="bold">Substation</text><text x="286" y="114" font-size="9.5">transformers</text><text x="286" y="126" font-size="9.5">change voltage</text>
<text x="400" y="98" font-weight="bold">Distribution</text><text x="400" y="114" font-size="9.5">lower voltage</text><text x="400" y="126" font-size="9.5">DSOs</text>
</g>
<g stroke="#1f3a5f" stroke-width="1.4" marker-end="url(#ar)"><line x1="93" y1="105" x2="116" y2="105"/><line x1="216" y1="105" x2="239" y2="105"/><line x1="331" y1="105" x2="354" y2="105"/><line x1="444" y1="105" x2="451" y2="105"/><line x1="485" y1="105" x2="492" y2="105"/></g>
<path d="M241,150 L444,150" stroke="#b5482f" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="342" y="168" text-anchor="middle" fill="#b5482f" font-size="10">Congestion: cables and transformers</text>
<text x="342" y="181" text-anchor="middle" fill="#b5482f" font-size="10">reach their limit at peak times</text>
<rect x="453" y="90" width="32" height="30" rx="3" fill="#1f3a5f"/><text x="469" y="109" text-anchor="middle" fill="#fff" font-size="8.5">meter</text>
<text x="469" y="136" text-anchor="middle" font-size="8.5" fill="#1f3a5f">limit</text><text x="469" y="146" text-anchor="middle" font-size="8.5" fill="#1f3a5f">(kW)</text>
<text x="575" y="40" text-anchor="middle" font-weight="bold" fill="#1f3a5f">Site (behind the meter)</text>
<g fill="#f2f5f9" stroke="#9aaccc"><rect x="503" y="52" width="70" height="30" rx="4"/><rect x="579" y="52" width="70" height="30" rx="4"/><rect x="503" y="90" width="70" height="30" rx="4"/><rect x="579" y="90" width="70" height="30" rx="4"/><rect x="503" y="128" width="70" height="30" rx="4"/><rect x="579" y="128" width="70" height="30" rx="4"/></g>
<g text-anchor="middle" font-size="10"><text x="538" y="71">Battery</text><text x="614" y="71">EV chargers</text><text x="538" y="109">Heat pump</text><text x="614" y="109">Solar PV</text><text x="538" y="147">Data centre</text><text x="614" y="147">Other loads</text></g>
<rect x="503" y="172" width="146" height="50" rx="4" fill="#1f3a5f"/>
<text x="576" y="192" text-anchor="middle" fill="#fff" font-weight="bold" font-size="10.5">Energy management (EMS)</text>
<text x="576" y="208" text-anchor="middle" fill="#dfe7f1" font-size="9">keeps the site within its limit</text>
<text x="5" y="215" font-size="9.5" fill="#555">Flexibility = the site shifting or limiting its power in time,</text>
<text x="5" y="228" font-size="9.5" fill="#555">so that it stays within the grid's limits.</text>
</svg>
