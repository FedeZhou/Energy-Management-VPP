<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="mpcloop-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Model predictive control: plan ahead, apply the first step, replan</text><rect x="80" y="70" width="180" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="170.0" y="95.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Measure</text><text x="170.0" y="112.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">SoC, site power</text><rect x="300" y="70" width="180" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="390.0" y="95.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Forecast</text><text x="390.0" y="112.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">EV arrivals, load, prices</text><rect x="520" y="70" width="180" height="60" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="610.0" y="95.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Optimise</text><text x="610.0" y="112.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">best plan over the horizon</text><rect x="520" y="190" width="180" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="610.0" y="215.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Apply</text><text x="610.0" y="232.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">only the first step</text><rect x="80" y="190" width="180" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="170.0" y="215.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Wait</text><text x="170.0" y="232.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">one time step, then repeat</text><path d="M 260 100 L 296 100" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#mpcloop-ar-edge)"/><path d="M 480 100 L 516 100" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#mpcloop-ar-edge)"/><path d="M 610 130 L 610 186" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#mpcloop-ar-edge)"/><path d="M 516 220 L 264 220" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#mpcloop-ar-edge)"/><path d="M 170 190 L 170 134" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#mpcloop-ar-edge)"/><text x="620" y="165" font-size="11.5" fill="#5a5a5a">constraints: grid limit,</text><text x="620" y="180" font-size="11.5" fill="#5a5a5a">battery power and energy</text><text x="24" y="286" font-size="11.5" fill="#5a5a5a" font-style="italic">Replanning at every step is what corrects forecast errors; the margins chosen in the optimiser decide how safe the plan is.</text></svg>