<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="bessanat-ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d5b"/></marker><marker id="bessanat-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Inside a BESS: energy hardware on the left, control layers on the right</text><rect x="24" y="56" width="420" height="330" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="234" y="78" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Energy path</text><rect x="40" y="96" width="110" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="95.0" y="119.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Cells</text><text x="95.0" y="136.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">LFP, 3.2 V</text><rect x="170" y="96" width="110" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="225.0" y="119.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Modules</text><text x="225.0" y="136.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">e.g. 52 cells</text><rect x="300" y="96" width="128" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="364.0" y="119.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Racks (clusters)</text><text x="364.0" y="136.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">modules in series</text><path d="M 150 124 L 166 124" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><path d="M 280 124 L 296 124" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><rect x="170" y="190" width="258" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="299.0" y="213.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">DC block / cabinet</text><text x="299.0" y="230.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">racks, DC switchgear, fuses</text><path d="M 364 152 L 364 186" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><rect x="170" y="280" width="258" height="56" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="299.0" y="303.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">PCS (inverter) or DC/DC</text><text x="299.0" y="320.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">AC grid or DC bus</text><path d="M 299 246 L 299 276" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><rect x="40" y="190" width="110" height="146" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="95.0" y="233.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Auxiliaries</text><text x="95.0" y="250.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">liquid cooling,</text><text x="95.0" y="267.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">HVAC, fire</text><text x="95.0" y="284.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">detection and</text><text x="95.0" y="301.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">suppression</text><text x="40" y="370" font-size="11" fill="#5a5a5a">Auxiliaries use energy too: efficiency depends on where it is measured.</text><rect x="476" y="56" width="260" height="330" rx="8" fill="#1f3a5f" fill-opacity="0.05" stroke="#1f3a5f" stroke-width="1.25"/><text x="606" y="78" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Control layers</text><rect x="492" y="94" width="228" height="46" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="606.0" y="113.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Site EMS / aggregator</text><text x="606.0" y="129.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">schedules, markets, grid limit · minutes to day</text><path d="M 596 140 L 596 149" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><path d="M 616 149 L 616 140" fill="none" stroke="#2e7d5b" stroke-width="1.25" marker-end="url(#bessanat-ar-c3)"/><rect x="492" y="150" width="228" height="46" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="606.0" y="169.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Plant controller (EMS)</text><text x="606.0" y="185.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">splits setpoints, SoC balancing · seconds</text><path d="M 596 196 L 596 205" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><path d="M 616 205 L 616 196" fill="none" stroke="#2e7d5b" stroke-width="1.25" marker-end="url(#bessanat-ar-c3)"/><rect x="492" y="206" width="228" height="46" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="606.0" y="225.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">PCS control</text><text x="606.0" y="241.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">current or voltage control · milliseconds</text><path d="M 596 252 L 596 261" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><path d="M 616 261 L 616 252" fill="none" stroke="#2e7d5b" stroke-width="1.25" marker-end="url(#bessanat-ar-c3)"/><rect x="492" y="262" width="228" height="46" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="606.0" y="281.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">BMS: system level (BAMS/BAU)</text><text x="606.0" y="297.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">limits, contactors, alarms</text><path d="M 596 308 L 596 317" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#bessanat-ar-edge)"/><path d="M 616 317 L 616 308" fill="none" stroke="#2e7d5b" stroke-width="1.25" marker-end="url(#bessanat-ar-c3)"/><rect x="492" y="318" width="228" height="46" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="606.0" y="337.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">BMS: rack (BCU) and module (BMU)</text><text x="606.0" y="353.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">cell voltages, temperatures, balancing</text><text x="606" y="378" font-size="11" text-anchor="middle" fill="#5a5a5a">grey: commands down · green: limits and states up</text></svg>