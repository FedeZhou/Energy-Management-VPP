<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="cell-ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5482f"/></marker><marker id="cell-ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d5b"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Inside a lithium-ion cell: ions cross inside, electrons go around</text><rect x="60" y="90" width="170" height="170" rx="8" fill="#d6d9de" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.25"/><text x="145" y="282" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">Negative electrode (anode)</text><text x="145" y="299" font-size="11.5" text-anchor="middle" fill="#5a5a5a">graphite layers host Li</text><path d="M75 108L215 108" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M75 135L215 135" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M75 162L215 162" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M75 189L215 189" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M75 216L215 216" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M75 243L215 243" fill="none" stroke="#6b7280" stroke-width="2"/><rect x="300" y="90" width="26" height="170" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="3 3"/><text x="313" y="282" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">Separator</text><text x="313" y="299" font-size="11.5" text-anchor="middle" fill="#5a5a5a">passes ions,</text><text x="313" y="315" font-size="11.5" text-anchor="middle" fill="#5a5a5a">blocks electrons</text><rect x="396" y="90" width="170" height="170" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="481" y="282" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">Positive electrode (cathode)</text><text x="481" y="299" font-size="11.5" text-anchor="middle" fill="#5a5a5a">LFP or NMC crystal hosts Li</text><circle cx="416" cy="112" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="448" cy="112" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="480" cy="112" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="512" cy="112" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="544" cy="112" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="416" cy="154" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="448" cy="154" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="480" cy="154" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="512" cy="154" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="544" cy="154" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="416" cy="196" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="448" cy="196" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="480" cy="196" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="512" cy="196" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="544" cy="196" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="416" cy="238" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="448" cy="238" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="480" cy="238" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="512" cy="238" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="544" cy="238" r="9" fill="none" stroke="#1f3a5f" stroke-width="1.25"/><text x="265" y="250" font-size="11.5" text-anchor="middle" fill="#5a5a5a">electrolyte</text><path d="M 240 150 L 386 150" fill="none" stroke="#b5482f" stroke-width="2" marker-end="url(#cell-ar-c2)"/><rect x="262" y="128" width="102" height="16" rx="3" fill="#ffffff" stroke="none" stroke-width="1.25"/><text x="313" y="140" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b5482f">Li⁺ on discharge</text><path d="M 386 200 L 240 200" fill="none" stroke="#2e7d5b" stroke-width="2" marker-end="url(#cell-ar-c3)"/><rect x="272" y="210" width="82" height="16" rx="3" fill="#ffffff" stroke="none" stroke-width="1.25"/><text x="313" y="222" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2e7d5b">Li⁺ on charge</text><path d="M 145 90 L 145 62 L 481 62 L 481 90" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="283" y="50" width="60" height="24" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/><text x="313" y="66" font-size="12" text-anchor="middle" fill="#1d1d1d">load</text><path d="M 180 62 L 270 62" fill="none" stroke="#b5482f" stroke-width="2" marker-end="url(#cell-ar-c2)"/><text x="182" y="52" font-size="11.5" fill="#b5482f">e⁻ on discharge</text><text x="600" y="110" font-size="13" font-weight="600" fill="#1d1d1d">Discharge</text><text x="600" y="128" font-size="11.5" fill="#5a5a5a">anode: LiC₆ → C₆ + Li⁺ + e⁻</text><text x="600" y="146" font-size="11.5" fill="#5a5a5a">LFP: FePO₄ + Li⁺ + e⁻ → LiFePO₄</text><text x="600" y="180" font-size="13" font-weight="600" fill="#1d1d1d">Charge</text><text x="600" y="198" font-size="11.5" fill="#5a5a5a">the same reactions run</text><text x="600" y="214" font-size="11.5" fill="#5a5a5a">backwards, driven by</text><text x="600" y="230" font-size="11.5" fill="#5a5a5a">the charger</text><text x="24" y="340" font-size="11.5" fill="#5a5a5a">SEI: a thin film on the anode surface, formed in the first charge; it protects the anode but slowly consumes lithium.</text></svg>