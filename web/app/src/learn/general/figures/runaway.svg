<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="runaway-ar-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5482f"/></marker><marker id="runaway-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Thermal runaway: a chain of heat-releasing reactions</text><rect x="24" y="80" width="132" height="84" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="90.0" y="110.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Trigger</text><text x="90.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">overcharge, short,</text><text x="90.0" y="142.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">crush or heat</text><path d="M 156 122 L 168 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#runaway-ar-edge)"/><rect x="170" y="80" width="132" height="84" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="236.0" y="110.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">SEI breakdown</text><text x="236.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">onset about 80 °C</text><text x="236.0" y="142.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">(can be lower)</text><path d="M 302 122 L 314 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#runaway-ar-edge)"/><rect x="316" y="80" width="132" height="84" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="382.0" y="110.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Separator melts</text><text x="382.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">electrolyte breaks</text><text x="382.0" y="142.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">down, ~100–150 °C</text><path d="M 448 122 L 460 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#runaway-ar-edge)"/><rect x="462" y="80" width="132" height="84" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="528.0" y="110.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Oxygen release</text><text x="528.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">from the cathode;</text><text x="528.0" y="142.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">NMC/NCA before LFP</text><path d="M 594 122 L 606 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#runaway-ar-edge)"/><rect x="608" y="80" width="132" height="84" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="674.0" y="110.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Fire and spread</text><text x="674.0" y="126.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">venting, flames,</text><text x="674.0" y="142.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">next cells heat up</text><path d="M 40 200 L 720 200" fill="none" stroke="#b5482f" stroke-width="2" marker-end="url(#runaway-ar-crit)"/><text x="40" y="222" font-size="11.5" fill="#b5482f">temperature rises, each step releases more heat</text><text x="24" y="262" font-size="11.5" fill="#5a5a5a" font-style="italic">Temperatures from reviews; they vary with chemistry, state of charge and cell design. Ceramic-coated separators</text><text x="24" y="278" font-size="11.5" fill="#5a5a5a" font-style="italic">and LFP cathodes raise the thresholds. Battery systems are designed to stop the chain early and to stop propagation.</text></svg>