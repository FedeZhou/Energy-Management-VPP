<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="kf-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">How a BMS estimates SoC: predict by counting charge, correct with voltage</text><rect x="24" y="70" width="200" height="70" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="124.0" y="100.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Predict</text><text x="124.0" y="117.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">SoC − I·Δt / Q</text><rect x="280" y="70" width="200" height="70" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="380.0" y="100.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Model voltage</text><text x="380.0" y="117.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">OCV(SoC) − I·R₀ − V₁</text><rect x="536" y="70" width="200" height="70" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="636.0" y="100.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Compare</text><text x="636.0" y="117.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">measured − modelled V</text><rect x="280" y="190" width="200" height="70" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="380.0" y="220.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Correct</text><text x="380.0" y="237.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">SoC + K × voltage error</text><path d="M 224 105 L 276 105" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#kf-ar-edge)"/><path d="M 480 105 L 532 105" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#kf-ar-edge)"/><path d="M 636 140 L 636 225 L 484 225" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#kf-ar-edge)"/><path d="M 280 225 L 124 225 L 124 144" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#kf-ar-edge)"/><text x="560" y="248" font-size="11.5" fill="#5a5a5a">NMC: steep OCV, voltage error</text><text x="560" y="264" font-size="11.5" fill="#5a5a5a">is informative, strong correction</text><text x="24" y="248" font-size="11.5" fill="#5a5a5a">LFP plateau: OCV barely moves,</text><text x="24" y="264" font-size="11.5" fill="#5a5a5a">little correction, estimate drifts</text><text x="24" y="290" font-size="11.5" fill="#5a5a5a" font-style="italic">Kalman filters choose the gain K from the relative uncertainty of the prediction and the measurement.</text></svg>