<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Perfect foresight spends the reserve; a real controller must keep it</text><path d="M80 250L700 250" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M80 250L80 70" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="80.0" y="268" font-size="11.5" text-anchor="middle" fill="#5a5a5a">00:00</text><text x="235.0" y="268" font-size="11.5" text-anchor="middle" fill="#5a5a5a">06:00</text><text x="390.0" y="268" font-size="11.5" text-anchor="middle" fill="#5a5a5a">12:00</text><text x="545.0" y="268" font-size="11.5" text-anchor="middle" fill="#5a5a5a">18:00</text><text x="700.0" y="268" font-size="11.5" text-anchor="middle" fill="#5a5a5a">24:00</text><text x="72" y="84" font-size="11.5" text-anchor="end" fill="#5a5a5a">full</text><text x="72" y="254" font-size="11.5" text-anchor="end" fill="#5a5a5a">empty</text><rect x="519.1666666666667" y="70" width="51.666666666666515" height="180" rx="0" fill="#b5482f" fill-opacity="0.08" stroke="none" stroke-width="1.25"/><text x="545.0" y="82" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b5482f">peak</text><path d="M80.0 97.0 L157.5 182.0 L235.0 97.0 L312.5 216.0 L390.0 190.5 L467.5 156.5 L519.2 156.5 L570.8 241.5 L622.5 165.0 L700.0 97.0" fill="none" stroke="#b5482f" stroke-width="2.5"/><path d="M80.0 97.0 L157.5 122.5 L235.0 88.5 L312.5 139.5 L390.0 131.0 L467.5 97.0 L519.2 88.5 L570.8 173.5 L622.5 131.0 L700.0 97.0" fill="none" stroke="#1f3a5f" stroke-width="2.5"/><path d="M80 148.0L700 148.0" fill="none" stroke="#1f3a5f" stroke-width="1" stroke-dasharray="4 4"/><text x="131.7" y="233.0" font-size="11.5" font-weight="600" fill="#b5482f">perfect foresight: trades deep, lands near empty after the peak</text><text x="105.8" y="75.4" font-size="11.5" font-weight="600" fill="#1f3a5f">realistic controller</text><text x="24" y="290" font-size="11.5" fill="#5a5a5a" font-style="italic">Schematic state of charge over one day; dashed line = reserve kept for uncertain peaks. Sizing with the first curve looks cheaper than reality;</text><text x="24" y="306" font-size="11.5" fill="#5a5a5a" font-style="italic">so sizing should use the controller that will actually run the site (Section 8.3).</text></svg>