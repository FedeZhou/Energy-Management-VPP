165.0 270.0 L 315.0 196.66666666666669 L 427.5 196.66666666666669 L 430.9 196.66666666666669 L 690.0 70.0" fill="none" stroke="#2e7d5b" stroke-width="2" stroke-dasharray="5 4"/><text x="225.0" y="123.3" font-size="12" font-weight="600" text-anchor="end" fill="#1f3a5f">charge as soon as possible</text><text x="225.0" y="139.3" font-size="11.5" text-anchor="end" fill="#5a5a5a">full at 10:44</text><text x="510.0" y="236.7" font-size="12" font-weight="600" text-anchor="end" fill="#b5482f">charge as late as possible</text><text x="510.0" y="252.7" font-size="11.5" text-anchor="end" fill="#5a5a5a">start at 09:16</text><text x="450.0" y="176.7" font-size="11.5" font-weight="600" fill="#2e7d5b">one feasible path</text><text x="24" y="312" font-size="11.5" fill="#5a5a5a" font-style="italic">Worked example: 30 kWh needed, 11 kW charger, plugged in 08:00 to 12:00. The shaded area is the flexibility a site can use.</text><text x="24" y="328" font-size="11.5" fill="#5a5a5a" font-style="italic">For a fleet, the envelopes add up (Minkowski sum); compact versions of that sum are what Section 4.1 describes.</text></svg>