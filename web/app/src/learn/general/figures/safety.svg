<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="safety-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">A safety layer turns any learned action into a safe one</text><rect x="24" y="80" width="170" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="109.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">RL policy</text><text x="109.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">proposes action</text><rect x="270" y="80" width="200" height="64" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="370.0" y="99.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Safety layer</text><text x="370.0" y="116.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">nearest action inside</text><text x="370.0" y="133.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">the constraints</text><rect x="546" y="80" width="190" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="641.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Site</text><text x="641.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">battery, chargers</text><path d="M 194 112 L 266 112" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#safety-ar-edge)"/><path d="M 470 112 L 542 112" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#safety-ar-edge)"/><path d="M 640 144 L 640 180 L 110 180 L 110 148" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#safety-ar-edge)"/><text x="375" y="172" font-size="11.5" text-anchor="middle" fill="#5a5a5a">state and reward</text><text x="230" y="100" font-size="11.5" text-anchor="middle" fill="#b5482f">e.g. +250 kW</text><text x="506" y="100" font-size="11.5" text-anchor="middle" fill="#2e7d5b">+200 kW</text><text x="24" y="212" font-size="11.5" fill="#5a5a5a" font-style="italic">Example: the policy asks for 250 kW of charging, but the battery limit is 200 kW; the layer passes 200 kW.</text></svg>