<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">From energy needed to nameplate: each factor makes the battery bigger</text><text x="308" y="80" font-size="12.5" font-weight="600" text-anchor="end" fill="#1d1d1d">Energy to deliver (P50)</text><rect x="320" y="64" width="192.0" height="26" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="520.0" y="82" font-size="12" font-weight="600" fill="#1d1d1d">1,200 kWh</text><text x="308" y="124" font-size="12.5" text-anchor="end" fill="#1d1d1d">÷ 0.85 usable SoC window</text><rect x="320" y="108" width="225.92000000000002" height="26" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="553.9" y="126" font-size="12" font-weight="600" fill="#1d1d1d">1,412 kWh</text><text x="308" y="168" font-size="12.5" text-anchor="end" fill="#1d1d1d">÷ 0.80 capacity at end of life</text><rect x="320" y="152" width="282.40000000000003" height="26" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="610.4" y="170" font-size="12" font-weight="600" fill="#1d1d1d">1,765 kWh</text><text x="308" y="212" font-size="12.5" font-weight="600" text-anchor="end" fill="#1d1d1d">÷ 0.95 discharge efficiency</text><rect x="320" y="196" width="297.28000000000003" height="26" rx="3" fill="#1f3a5f" fill-opacity="0.3" stroke="#1f3a5f" stroke-width="1.25"/><text x="625.3" y="214" font-size="12" font-weight="600" fill="#1d1d1d">1,858 kWh</text><text x="308" y="266" font-size="12.5" font-weight="600" text-anchor="end" fill="#b5482f">Same chain from P90 demand</text><rect x="320" y="250" width="396.32" height="26" rx="3" fill="#b5482f" fill-opacity="0.2" stroke="#b5482f" stroke-width="1.25"/><text x="708.3" y="268" font-size="12" font-weight="600" text-anchor="end" fill="#1d1d1d">2,477 kWh (+33%)</text><text x="24" y="292" font-size="11.5" fill="#5a5a5a" font-style="italic">Illustrative factors; real projects use the manufacturer’s usable window, warranty end-of-life and measured efficiency.</text></svg>