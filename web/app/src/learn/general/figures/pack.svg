<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="pack-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">From cell to pack: series adds voltage, parallel adds capacity</text><rect x="24" y="60" width="150" height="190" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="99" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Cell</text><rect x="84" y="95" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="99" y="160" font-size="11.5" text-anchor="middle" fill="#5a5a5a">e.g. 280 Ah × 3.2 V</text><text x="99" y="176" font-size="11.5" text-anchor="middle" fill="#5a5a5a">≈ 0.9 kWh</text><text x="99" y="210" font-size="11.5" text-anchor="middle" fill="#5a5a5a">cylindrical, prismatic</text><text x="99" y="226" font-size="11.5" text-anchor="middle" fill="#5a5a5a">or pouch</text><rect x="214" y="60" width="190" height="190" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="309" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Module</text><rect x="230" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="251" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="272" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="293" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="314" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="335" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="356" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><rect x="377" y="100" width="14" height="34" rx="3" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="309" y="160" font-size="11.5" text-anchor="middle" fill="#5a5a5a">16 cells in series (16S)</text><text x="309" y="176" font-size="11.5" text-anchor="middle" fill="#5a5a5a">16 × 3.2 V = 51.2 V</text><text x="309" y="192" font-size="11.5" text-anchor="middle" fill="#5a5a5a">≈ 14 kWh</text><text x="309" y="226" font-size="11.5" text-anchor="middle" fill="#5a5a5a">cell sensing, busbars</text><rect x="444" y="60" width="292" height="190" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="590" y="84" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Pack (EV) or rack (stationary)</text><rect x="460" y="100" width="40" height="40" rx="4" fill="#d6d9de" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.25"/><rect x="508" y="100" width="40" height="40" rx="4" fill="#d6d9de" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.25"/><rect x="556" y="100" width="40" height="40" rx="4" fill="#d6d9de" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.25"/><rect x="604" y="100" width="40" height="40" rx="4" fill="#d6d9de" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.25"/><rect x="660" y="100" width="60" height="40" rx="4" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="1.25"/><text x="690" y="125" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">BMS</text><text x="590" y="166" font-size="11.5" text-anchor="middle" fill="#5a5a5a">8 modules in series ≈ 410 V, ≈ 115 kWh</text><text x="590" y="190" font-size="11.5" text-anchor="middle" fill="#5a5a5a">plus BMS, contactors, fuses,</text><text x="590" y="206" font-size="11.5" text-anchor="middle" fill="#5a5a5a">cooling, enclosure</text><path d="M 174 155 L 210 155" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#pack-ar-edge)"/><path d="M 404 155 L 440 155" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#pack-ar-edge)"/><text x="24" y="280" font-size="11.5" fill="#5a5a5a" font-style="italic">Numbers are an illustrative LFP example; real products vary.</text></svg>