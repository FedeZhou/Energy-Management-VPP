<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Worked example: a time-block contract and the battery that makes it work</text><path d="M80 270L700 270" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M80 270L80 70" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="72" y="274.0" font-size="11.5" text-anchor="end" fill="#5a5a5a">0 kW</text><path d="M80 270.0L700 270.0" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="72" y="188.3" font-size="11.5" text-anchor="end" fill="#5a5a5a">600 kW</text><path d="M80 184.28571428571428L700 184.28571428571428" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="72" y="145.4" font-size="11.5" text-anchor="end" fill="#5a5a5a">900 kW</text><path d="M80 141.42857142857142L700 141.42857142857142" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="72" y="102.6" font-size="11.5" text-anchor="end" fill="#5a5a5a">1200 kW</text><path d="M80 98.57142857142858L700 98.57142857142858" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="80.0" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">00:00</text><text x="183.3" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">04:00</text><text x="286.7" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">08:00</text><text x="390.0" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">12:00</text><text x="493.3" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">16:00</text><text x="596.7" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">20:00</text><text x="700.0" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">24:00</text><rect x="493.3333333333333" y="141.42857142857142" width="103.33333333333343" height="42.85714285714286" rx="0" fill="#b5482f" fill-opacity="0.18" stroke="#b5482f" stroke-width="1.25"/><rect x="596.6666666666667" y="105.71428571428572" width="52.95833333333326" height="92.85714285714283" rx="0" fill="#2e7d5b" fill-opacity="0.15" stroke="#2e7d5b" stroke-width="1.25"/><path d="M80.0 198.6 L235.0 198.6 L235.0 177.1 L493.3 177.1 L493.3 141.4 L596.7 141.4 L596.7 198.6 L700.0 198.6" fill="none" stroke="#6b7280" stroke-width="2.5"/><path d="M 80.0 98.57142857142858 L 493.3333333333333 98.57142857142858 L 493.3333333333333 184.28571428571428 L 596.6666666666667 184.28571428571428 L 596.6666666666667 98.57142857142858 L 700.0 98.57142857142858" fill="none" stroke="#b5482f" stroke-width="2" stroke-dasharray="6 4"/><text x="545.0" y="152.9" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b5482f">battery</text><text x="545.0" y="167.9" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b5482f">1,200 kWh</text><text x="623.0" y="148.6" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2e7d5b">recharge</text><text x="105.8" y="90.6" font-size="11.5" font-weight="600" fill="#b5482f">contract limit: 1,200 kW, 600 kW from 16:00 to 20:00</text><text x="105.8" y="216.6" font-size="11.5" font-weight="600" fill="#1d1d1d">site demand forecast (P50)</text><text x="24" y="310" font-size="11.5" fill="#5a5a5a" font-style="italic">Illustrative depot. In the blocked window demand of 900 kW exceeds the 600 kW limit, so the battery supplies</text><text x="24" y="326" font-size="11.5" fill="#5a5a5a" font-style="italic">300 kW for 4 hours = 1,200 kWh, then recharges below the limit. If the P90 evening demand is 1,000 kW, it needs 1,600 kWh.</text><text x="24" y="342" font-size="11.5" fill="#5a5a5a" font-style="italic">Recharging at 650 kW (headroom is 700 kW) refills it in about 2 hours, including charge and discharge losses.</text></svg>