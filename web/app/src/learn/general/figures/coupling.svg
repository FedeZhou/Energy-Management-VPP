/text><text x="280" y="437" font-size="11.5" fill="#5a5a5a">grid → battery: 2</text><text x="520" y="436" font-size="11.5" fill="#5a5a5a">Same conversions as DC-coupled</text><text x="24" y="476" font-size="11.5" fill="#5a5a5a" font-style="italic">Schematic. Grey arrows: charging direction; green: battery discharge. Each converter is one conversion (the charger box holds two).</text><text x="24" y="492" font-size="11.5" fill="#5a5a5a" font-style="italic">The DC bus saves conversions on battery and PV paths but adds one when the battery is charged from the grid.</text></svg>