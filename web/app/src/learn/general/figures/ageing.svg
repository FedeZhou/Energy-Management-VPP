<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Where ageing happens in the cell, and what it does to capacity</text><rect x="24" y="56" width="330" height="210" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="189" y="78" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Mechanisms</text><text x="40" y="106" font-size="12.5" font-weight="600" fill="#1d1d1d">SEI growth on the anode</text><text x="40" y="122" font-size="11.5" fill="#5a5a5a">consumes lithium; faster when hot and at high SoC</text><text x="40" y="148" font-size="12.5" font-weight="600" fill="#1d1d1d">Lithium plating</text><text x="40" y="164" font-size="11.5" fill="#5a5a5a">fast or cold charging; capacity loss, safety risk</text><text x="40" y="190" font-size="12.5" font-weight="600" fill="#1d1d1d">Particle cracking</text><text x="40" y="206" font-size="11.5" fill="#5a5a5a">mechanical stress from expansion in cycling</text><text x="40" y="232" font-size="12.5" font-weight="600" fill="#1d1d1d">Cathode degradation</text><text x="40" y="248" font-size="11.5" fill="#5a5a5a">loss of active material, resistance rise</text><path d="M430 250L730 250" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M430 250L430 70" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="424" y="84" font-size="11.5" text-anchor="end" fill="#5a5a5a">100%</text><text x="424" y="194" font-size="11.5" text-anchor="end" fill="#5a5a5a">80%</text><path d="M430 190L730 190" fill="none" stroke="#d6d9de" stroke-width="1" stroke-dasharray="4 4"/><text x="438" y="184" font-size="11.5" fill="#5a5a5a">typical end of life</text><path d="M430.0 80.0 L436.1 86.9 L442.2 89.7 L448.4 91.9 L454.5 93.7 L460.6 95.3 L466.7 96.8 L472.9 98.1 L479.0 99.4 L485.1 100.6 L491.2 101.7 L497.3 102.7 L503.5 103.8 L509.6 104.7 L515.7 105.7 L521.8 106.6 L528.0 107.4 L534.1 108.3 L540.2 109.1 L546.3 109.9 L552.4 110.7 L558.6 111.4 L564.7 112.2 L570.8 112.9 L576.9 113.6 L583.1 114.3 L589.2 115.0 L595.3 115.6 L601.4 116.3 L607.6 116.9 L613.7 117.6 L619.8 118.2 L625.9 118.8 L632.0 119.4 L638.2 120.0 L644.3 120.7 L650.4 122.2 L656.5 124.4 L662.7 127.3 L668.8 130.9 L674.9 135.3 L681.0 140.4 L687.1 146.2 L693.3 152.7 L699.4 160.0 L705.5 168.0 L711.6 176.7 L717.8 186.1 L723.9 196.3 L730.0 207.2" fill="none" stroke="#1f3a5f" stroke-width="2.5"/><text x="450" y="150" font-size="11.5" font-weight="600" fill="#1f3a5f">early fade roughly follows √t (SEI)</text><text x="646.0" y="222" font-size="11.5" font-weight="600" text-anchor="end" fill="#b5482f">knee</text><text x="580.0" y="270" font-size="11.5" text-anchor="middle" fill="#5a5a5a">years or cycles →</text><text x="440" y="64" font-size="12" font-weight="600" fill="#1d1d1d">capacity</text><text x="24" y="316" font-size="11.5" fill="#5a5a5a" font-style="italic">Illustrative curve. Real trajectories vary by chemistry, temperature and use; knees are hard to predict.</text></svg>