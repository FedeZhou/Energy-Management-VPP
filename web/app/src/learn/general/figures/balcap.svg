<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="balcap-ar-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f3a5f"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Balance is system-wide; capacity is local</text><rect x="24" y="56" width="340" height="170" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="194" y="80" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Balance (TSO)</text><path d="M 194 150 L 194 130" fill="none" stroke="#6b7280" stroke-width="2"/><path d="M 84 130 L 304 130" fill="none" stroke="#6b7280" stroke-width="2.5"/><path d="M 194 150 L 180 166 L 208 166 Z" fill="#d6d9de" fill-opacity="0.6" stroke="#6b7280" stroke-width="1.25"/><rect x="84" y="104" width="70" height="26" rx="8" fill="#2e7d5b" fill-opacity="0.15" stroke="#2e7d5b" stroke-width="1.25"/><text x="119" y="122" font-size="12" text-anchor="middle" fill="#1d1d1d">supply</text><rect x="234" y="104" width="70" height="26" rx="8" fill="#b5482f" fill-opacity="0.15" stroke="#b5482f" stroke-width="1.25"/><text x="269" y="122" font-size="12" text-anchor="middle" fill="#1d1d1d">demand</text><text x="194" y="190" font-size="11.5" text-anchor="middle" fill="#5a5a5a">must match every second</text><text x="194" y="206" font-size="11.5" text-anchor="middle" fill="#5a5a5a">→ frequency stays at 50 Hz</text><rect x="396" y="56" width="340" height="170" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="566" y="80" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Capacity (DSO and TSO)</text><path d="M 416 130 L 516 130 L 546 142 L 586 142 L 616 130 L 716 130" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M 416 170 L 516 170 L 546 158 L 586 158 L 616 170 L 716 170" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M 430 150 L 530 150" fill="none" stroke="#1f3a5f" stroke-width="3" marker-end="url(#balcap-ar-accent)"/><path d="M 600 150 L 700 150" fill="none" stroke="#1f3a5f" stroke-width="3" marker-end="url(#balcap-ar-accent)"/><text x="566" y="114" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b5482f">bottleneck: cable or transformer</text><text x="566" y="196" font-size="11.5" text-anchor="middle" fill="#5a5a5a">too much flow for too long → overheating;</text><text x="566" y="212" font-size="11.5" text-anchor="middle" fill="#5a5a5a">congestion even with plenty of energy</text><text x="24" y="250" font-size="11.5" fill="#5a5a5a" font-style="italic">Schematic.</text></svg>