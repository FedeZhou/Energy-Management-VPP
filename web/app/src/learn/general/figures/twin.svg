<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="twin-ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d5b"/></marker><marker id="twin-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">One site model, two uses: planning offline and control online</text><rect x="24" y="56" width="712" height="90" rx="8" fill="#1f3a5f" fill-opacity="0.06" stroke="#1f3a5f" stroke-width="1.25"/><text x="380" y="78" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Digital twin of the site</text><rect x="40" y="88" width="126" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="103.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Battery</text><text x="103.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">ECM + ageing</text><rect x="178" y="88" width="126" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="241.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">EV charging</text><text x="241.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">arrivals, curves</text><rect x="316" y="88" width="126" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="379.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Other loads</text><text x="379.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">heat pump, base</text><rect x="454" y="88" width="126" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="517.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Solar</text><text x="517.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">forecast</text><rect x="592" y="88" width="126" height="48" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="655.0" y="107.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Grid contract</text><text x="655.0" y="124.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">limits over time</text><rect x="24" y="200" width="330" height="70" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="189.0" y="222.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Planning (offline)</text><text x="189.0" y="239.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">battery size, contract choice,</text><text x="189.0" y="256.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">P(limit breach) over years</text><rect x="406" y="200" width="330" height="70" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="571.0" y="222.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Operation (online)</text><text x="571.0" y="239.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">uncertainty-aware MPC,</text><text x="571.0" y="256.3" font-size="11.5" text-anchor="middle" fill="#5a5a5a">keeps the promise in real time</text><path d="M 189 146 L 189 196" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#twin-ar-edge)"/><path d="M 571 146 L 571 196" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#twin-ar-edge)"/><rect x="406" y="290" width="330" height="40" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="571.0" y="314.3" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Real site: meter, BMS, chargers</text><path d="M 500 290 L 500 274" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#twin-ar-edge)"/><path d="M 736 310 L 750 310 L 750 100 L 740 100" fill="none" stroke="#2e7d5b" stroke-width="1.5" marker-end="url(#twin-ar-c3)"/><text x="744" y="96" font-size="11" fill="#1d1d1d"></text><text x="24" y="300" font-size="11.5" fill="#2e7d5b">Field data recalibrates the twin (green),</text><text x="24" y="316" font-size="11.5" fill="#2e7d5b">so plan and control use the same model.</text></svg>