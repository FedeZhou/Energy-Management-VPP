<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="markets-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Markets run on different clocks, from the day before to seconds</text><path d="M 40 120 L 720 120" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#markets-ar-edge)"/><circle cx="95" cy="120" r="6" fill="#1f3a5f" fill-opacity="0.3" stroke="#1f3a5f" stroke-width="1.25"/><text x="95" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">Day-ahead auction</text><text x="95" y="102" font-size="11.5" text-anchor="middle" fill="#5a5a5a">day before delivery</text><circle cx="250" cy="120" r="6" fill="#1f3a5f" fill-opacity="0.3" stroke="#1f3a5f" stroke-width="1.25"/><text x="250" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">Intraday trading</text><text x="250" y="102" font-size="11.5" text-anchor="middle" fill="#5a5a5a">until shortly before</text><circle cx="430" cy="120" r="6" fill="#1f3a5f" fill-opacity="0.3" stroke="#1f3a5f" stroke-width="1.25"/><text x="430" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">mFRR</text><text x="430" y="102" font-size="11.5" text-anchor="middle" fill="#5a5a5a">full in 12.5 min</text><circle cx="540" cy="120" r="6" fill="#1f3a5f" fill-opacity="0.3" stroke="#1f3a5f" stroke-width="1.25"/><text x="540" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">aFRR</text><text x="540" y="102" font-size="11.5" text-anchor="middle" fill="#5a5a5a">full in 5 min</text><circle cx="650" cy="120" r="6" fill="#1f3a5f" fill-opacity="0.3" stroke="#1f3a5f" stroke-width="1.25"/><text x="650" y="86" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">FCR</text><text x="650" y="102" font-size="11.5" text-anchor="middle" fill="#5a5a5a">full in 30 s</text><text x="40" y="150" font-size="11.5" fill="#5a5a5a">earlier</text><text x="720" y="150" font-size="11.5" text-anchor="end" fill="#5a5a5a">delivery: real time</text><rect x="400" y="166" width="300" height="30" rx="8" fill="#2e7d5b" fill-opacity="0.1" stroke="#2e7d5b" stroke-width="1.25"/><text x="550" y="186" font-size="12" text-anchor="middle" fill="#1d1d1d">balancing, bought by the TSO</text><rect x="40" y="166" width="330" height="30" rx="8" fill="#1f3a5f" fill-opacity="0.08" stroke="#1f3a5f" stroke-width="1.25"/><text x="205" y="186" font-size="12" text-anchor="middle" fill="#1d1d1d">energy trading</text><text x="24" y="222" font-size="11.5" fill="#5a5a5a" font-style="italic">Not to scale.</text></svg>