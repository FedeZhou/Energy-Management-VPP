<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Droop control on a DC bus: converters share current by letting voltage sag</text><path d="M90 260L700 260" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M90 260L90 70" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="82" y="236.9" font-size="11.5" text-anchor="end" fill="#5a5a5a">750 V</text><path d="M90 232.85714285714286L700 232.85714285714286" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="82" y="209.7" font-size="11.5" text-anchor="end" fill="#5a5a5a">760 V</text><path d="M90 205.71428571428572L700 205.71428571428572" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="82" y="155.4" font-size="11.5" text-anchor="end" fill="#5a5a5a">780 V</text><path d="M90 151.42857142857144L700 151.42857142857144" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="82" y="101.1" font-size="11.5" text-anchor="end" fill="#5a5a5a">800 V</text><path d="M90 97.14285714285714L700 97.14285714285714" fill="none" stroke="#d6d9de" stroke-width="1"/><text x="90.0" y="278" font-size="11.5" text-anchor="middle" fill="#5a5a5a">0 A</text><text x="242.5" y="278" font-size="11.5" text-anchor="middle" fill="#5a5a5a">100 A</text><text x="395.0" y="278" font-size="11.5" text-anchor="middle" fill="#5a5a5a">200 A</text><text x="547.5" y="278" font-size="11.5" text-anchor="middle" fill="#5a5a5a">300 A</text><text x="700.0" y="278" font-size="11.5" text-anchor="middle" fill="#5a5a5a">400 A</text><text x="395.0" y="298" font-size="11.5" text-anchor="middle" fill="#5a5a5a">converter output current</text><path d="M90.0 97.14285714285714L547.5 260.0" fill="none" stroke="#1f3a5f" stroke-width="2.5"/><text x="553.5" y="260.0" font-size="11" fill="#1d1d1d"></text><path d="M90.0 97.14285714285714L318.75 260.0" fill="none" stroke="#b5482f" stroke-width="2.5"/><path d="M90 205.71428571428572L700 205.71428571428572" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="5 4"/><circle cx="395.0" cy="205.71428571428572" r="5" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.25"/><circle cx="242.5" cy="205.71428571428572" r="5" fill="#b5482f" stroke="#b5482f" stroke-width="1.25"/><text x="410.6" y="197.7" font-size="12" font-weight="600" fill="#1f3a5f">A: R = 0.2 Ω → 200 A</text><text x="232.5" y="225.7" font-size="12" font-weight="600" text-anchor="end" fill="#b5482f">B: R = 0.4 Ω → 100 A</text><text x="700" y="197.7" font-size="11.5" text-anchor="end" fill="#5a5a5a">bus settles at 760 V</text><text x="24" y="322" font-size="11.5" fill="#5a5a5a" font-style="italic">Illustrative: V = 800 V − R × I for each converter, 300 A load. Current divides in inverse proportion to R.</text><text x="24" y="338" font-size="11.5" fill="#5a5a5a" font-style="italic">Larger R shares more precisely but lets the bus voltage deviate more; secondary control restores the voltage.</text></svg>