<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Same energy, different peak: why a connection limit is about kW</text><path d="M80 230L360 230" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M80 230L80 70" fill="none" stroke="#6b7280" stroke-width="1.25"/><rect x="90" y="117.5" width="74.66666666666667" height="112.5" rx="2" fill="#b5482f" fill-opacity="0.18" stroke="#b5482f" stroke-width="1.25"/><text x="127.3" y="177.8" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">50 kWh</text><text x="172.7" y="121.5" font-size="12" font-weight="600" fill="#b5482f">300 kW</text><text x="220.0" y="250" font-size="12" text-anchor="middle" fill="#5a5a5a">300 kW for 10 minutes</text><path d="M440 230L720 230" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M440 230L440 70" fill="none" stroke="#6b7280" stroke-width="1.25"/><rect x="450" y="173.75" width="149.33333333333334" height="56.25" rx="2" fill="#1f3a5f" fill-opacity="0.18" stroke="#1f3a5f" stroke-width="1.25"/><text x="524.7" y="205.9" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">50 kWh</text><text x="607.3" y="177.8" font-size="12" font-weight="600" fill="#1f3a5f">150 kW</text><text x="580.0" y="250" font-size="12" text-anchor="middle" fill="#5a5a5a">150 kW for 20 minutes</text><path d="M70 80L720 80" fill="none" stroke="#d6d9de" stroke-width="1" stroke-dasharray="4 4"/><text x="720" y="74" font-size="11.5" text-anchor="end" fill="#5a5a5a">400 kW</text><text x="70" y="62" font-size="11.5" font-weight="600" fill="#5a5a5a">power (kW)</text><text x="24" y="276" font-size="11.5" fill="#5a5a5a" font-style="italic">Energy = power × time = the area of each block. A battery needs a power rating (height) and an energy capacity (area).</text></svg>