<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="greybox-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Grey-box model: known physics plus a learned correction</text><rect x="24" y="120" width="140" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="94.0" y="145.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Inputs</text><text x="94.0" y="162.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">power, temperature</text><rect x="230" y="70" width="200" height="60" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="330.0" y="95.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Physics part</text><text x="330.0" y="112.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">energy balance, ECM</text><rect x="230" y="170" width="200" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="330.0" y="195.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Learned part</text><text x="330.0" y="212.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">neural net residual</text><circle cx="500" cy="150" r="18" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="500" y="155" font-size="16" font-weight="600" text-anchor="middle" fill="#1d1d1d">+</text><rect x="570" y="120" width="170" height="60" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="655.0" y="145.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Prediction</text><text x="655.0" y="162.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">SoC, voltage, power</text><path d="M 164 140 L 226 100" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#greybox-ar-edge)"/><path d="M 164 160 L 226 200" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#greybox-ar-edge)"/><path d="M 430 100 L 486 140" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#greybox-ar-edge)"/><path d="M 430 200 L 486 160" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#greybox-ar-edge)"/><path d="M 518 150 L 566 150" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#greybox-ar-edge)"/><text x="330" y="262" font-size="12" text-anchor="middle" fill="#1d1d1d">Training loss = data error + physics penalty (PINN) or physics built into the structure</text><text x="24" y="290" font-size="11.5" fill="#5a5a5a" font-style="italic">The physics part keeps predictions sensible outside the training data; the learned part captures what the equations miss.</text></svg>