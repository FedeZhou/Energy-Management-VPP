ll-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="267.0" y="220.58823529411765" width="18.66666666666667" height="49.41176470588235" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="287.66666666666663" y="238.23529411764707" width="18.66666666666667" height="31.764705882352928" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="308.3333333333333" y="255.88235294117646" width="18.66666666666667" height="14.117647058823536" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="329.0" y="262.94117647058823" width="18.66666666666667" height="7.058823529411768" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="349.6666666666667" y="245.2941176470588" width="18.66666666666667" height="24.705882352941188" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="370.3333333333333" y="262.94117647058823" width="18.66666666666667" height="7.058823529411768" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="391.0" y="262.94117647058823" width="18.66666666666667" height="7.058823529411768" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="411.6666666666667" y="259.4117647058824" width="18.66666666666667" height="10.588235294117624" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="453.0" y="262.94117647058823" width="18.66666666666667" height="7.058823529411768" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="473.66666666666663" y="262.94117647058823" width="18.66666666666667" height="7.058823529411768" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="494.3333333333333" y="266.47058823529414" width="18.66666666666667" height="3.5294117647058556" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><rect x="680.3333333333334" y="266.47058823529414" width="18.66666666666667" height="3.5294117647058556" rx="1" fill="#d6d9de" fill-opacity="0.8" stroke="#6b7280" stroke-width="1.25"/><text x="80.0" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">0</text><text x="183.3" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">250</text><text x="286.7" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">500</text><text x="390.0" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">750</text><text x="493.3" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">1000</text><text x="596.7" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">1250</text><text x="700.0" y="288" font-size="11.5" text-anchor="middle" fill="#5a5a5a">1500</text><text x="390.0" y="308" font-size="11.5" text-anchor="middle" fill="#5a5a5a">battery energy needed that day to stay under 400 kW (kWh)</text><text x="72" y="90" font-size="11.5" text-anchor="end" fill="#5a5a5a">days</text><path d="M179.32571023084904 70L179.32571023084904 270" fill="none" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="184.3" y="80" font-size="12" font-weight="600" fill="#1f3a5f">median ≈ 240 kWh</text><path d="M281.9544134866078 70L281.9544134866078 270" fill="none" stroke="#b5482f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="287.0" y="98" font-size="12" font-weight="600" fill="#b5482f">P90 ≈ 490 kWh</text><path d="M468.15581656674226 70L468.15581656674226 270" fill="none" stroke="#b5482f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="473.2" y="116" font-size="12" font-weight="600" fill="#b5482f">P99 ≈ 940 kWh</text><text x="24" y="320" font-size="11.5" fill="#5a5a5a" font-style="italic">365 synthetic days (random EV arrivals, 150 and 300 kW chargers), battery recharging only below the limit, losses ignored.</text><text x="24" y="336" font-size="11.5" fill="#5a5a5a" font-style="italic">A battery sized for the median day fails on about half the days; covering 99% of days needs roughly four times as much.</text></svg>