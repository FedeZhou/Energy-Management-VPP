<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ocpp-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Who controls an EV charging session: a chain of limits</text><rect x="24" y="90" width="166" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="107.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Site EMS / controller</text><text x="107.0" y="134.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">grid limit, battery, forecasts</text><rect x="206" y="90" width="166" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="289.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Charging backend (CSMS)</text><text x="289.0" y="134.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">fleet rules, pricing</text><rect x="388" y="90" width="166" height="64" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="471.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Charging station</text><text x="471.0" y="134.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">enforces the lowest limit</text><rect x="570" y="90" width="166" height="64" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="653.0" y="118.0" font-size="12" font-weight="600" text-anchor="middle" fill="#1d1d1d">Electric vehicle (BMS)</text><text x="653.0" y="134.0" font-size="10.5" text-anchor="middle" fill="#5a5a5a">accepts power up to its curve</text><path d="M 190 122 L 204 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#ocpp-ar-edge)"/><path d="M 372 122 L 386 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#ocpp-ar-edge)"/><path d="M 554 122 L 568 122" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#ocpp-ar-edge)"/><text x="379" y="72" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f3a5f">OCPP charging profiles</text><text x="561" y="72" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f3a5f">ISO 15118 / IEC 61851</text><path d="M 107 154 L 107 196 L 471 196 L 471 158" fill="none" stroke="#6b7280" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ocpp-ar-edge)"/><text x="290" y="190" font-size="11.5" text-anchor="middle" fill="#5a5a5a">local limit, or external constraints via OCPP</text><text x="24" y="236" font-size="12.5" font-weight="600" fill="#1d1d1d">OCPP 2.0.1 profile purposes:</text><text x="24" y="256" font-size="11.5" fill="#5a5a5a">ChargingStationMaxProfile – limit for the whole station</text><text x="24" y="272" font-size="11.5" fill="#5a5a5a">ChargingStationExternalConstraints – limit set by an external system</text><text x="400" y="256" font-size="11.5" fill="#5a5a5a">TxDefaultProfile – default for new sessions</text><text x="400" y="272" font-size="11.5" fill="#5a5a5a">TxProfile – limit for one running session</text><text x="24" y="306" font-size="11.5" fill="#5a5a5a" font-style="italic">Limits are schedules in W or A; when several apply, the station uses the lowest. The car’s BMS still decides</text><text x="24" y="322" font-size="11.5" fill="#5a5a5a" font-style="italic">what it accepts below that limit, which is why actual power follows the car’s charging curve.</text></svg>