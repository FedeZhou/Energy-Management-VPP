<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Four ways a flexible connection limits power over time</text><text x="24" y="60" font-size="13" font-weight="600" fill="#1d1d1d">Capacity-limited</text><text x="24" y="76" font-size="11.5" fill="#5a5a5a">lower firm limit until reinforcement</text><path d="M34 210L344 210" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M34 210L34 90" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M34 110L344 110" fill="none" stroke="#d6d9de" stroke-width="1" stroke-dasharray="4 4"/><path d="M 34 140 L 344 140" fill="none" stroke="#1f3a5f" stroke-width="2.5"/><text x="342" y="106" font-size="11.5" text-anchor="end" fill="#5a5a5a">requested</text><text x="400" y="60" font-size="13" font-weight="600" fill="#1d1d1d">Time-limited</text><text x="400" y="76" font-size="11.5" fill="#5a5a5a">reduced in pre-agreed windows</text><path d="M410 210L720 210" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M410 210L410 90" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M410 110L720 110" fill="none" stroke="#d6d9de" stroke-width="1" stroke-dasharray="4 4"/><path d="M 410 115 L 560 115 L 560 160 L 640 160 L 640 115 L 720 115" fill="none" stroke="#1f3a5f" stroke-width="2.5"/><text x="718" y="106" font-size="11.5" text-anchor="end" fill="#5a5a5a">requested</text><text x="24" y="230" font-size="13" font-weight="600" fill="#1d1d1d">Dynamic operating envelope</text><text x="24" y="246" font-size="11.5" fill="#5a5a5a">limit set ahead of each interval</text><path d="M34 380L344 380" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M34 380L34 260" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M34 280L344 280" fill="none" stroke="#d6d9de" stroke-width="1" stroke-dasharray="4 4"/>