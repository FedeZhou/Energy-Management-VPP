 81.4 L481.0 79.9 L496.7 78.6 L512.3 77.3 L527.9 76.1 L543.6 75.1 L559.2 74.1 L574.9 73.2 L590.5 72.5 L606.2 71.8 L621.8 71.3 L637.4 70.8 L653.1 70.5 L668.7 70.2 L684.4 70.1 L700.0 70.0" fill="none" stroke="#c08a1e" stroke-width="2.5"/><text x="100" y="240.4" font-size="12" font-weight="600" fill="#1f3a5f">evening: heavy load (EVs, heat pumps)</text><text x="364.5" y="72.9" font-size="12" font-weight="600" fill="#c08a1e">sunny midday: solar export</text><text x="90" y="270" font-size="11.5" fill="#5a5a5a">substation</text><text x="700" y="270" font-size="11.5" text-anchor="end" fill="#5a5a5a">end of feeder</text><text x="395.0" y="270" font-size="11.5" text-anchor="middle" fill="#5a5a5a">distance along the cable →</text><text x="94" y="60" font-size="12" font-weight="600" fill="#1d1d1d">voltage</text><text x="24" y="290" font-size="11.5" fill="#5a5a5a" font-style="italic">Schematic. Customers at the far end see the largest deviations. Voltage limits (dashed, ±10% band of EN 50160)</text><text x="24" y="306" font-size="11.5" fill="#5a5a5a" font-style="italic">can bind before the cable reaches its thermal limit, especially on long rural low-voltage feeders.</text></svg>