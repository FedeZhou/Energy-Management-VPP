<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="players-ar-c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b5482f"/></marker><marker id="players-ar-c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d5b"/></marker><marker id="players-ar-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">Energy and network are paid separately; flexibility can sell to several buyers</text><rect x="24" y="60" width="150" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="99.0" y="83.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Producers</text><text x="99.0" y="100.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">sell wholesale</text><rect x="300" y="60" width="170" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="385.0" y="83.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Wholesale markets</text><text x="385.0" y="100.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">day-ahead, intraday</text><rect x="590" y="60" width="150" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="665.0" y="83.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Supplier / BRP</text><text x="665.0" y="100.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">buys, sells, balances</text><rect x="24" y="190" width="150" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="99.0" y="213.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">TSO</text><text x="99.0" y="230.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">balancing reserves</text><rect x="300" y="190" width="170" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="385.0" y="213.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">DSO</text><text x="385.0" y="230.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">local network</text><rect x="590" y="190" width="150" height="56" rx="8" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="665.0" y="213.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Business site</text><text x="665.0" y="230.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">battery, chargers</text><rect x="300" y="300" width="170" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="385.0" y="323.8" font-size="13" font-weight="600" text-anchor="middle" fill="#1d1d1d">Aggregator</text><text x="385.0" y="340.8" font-size="11.5" text-anchor="middle" fill="#5a5a5a">bundles flexibility</text><path d="M 174 88 L 296 88" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#players-ar-edge)"/><path d="M 470 88 L 586 88" fill="none" stroke="#6b7280" stroke-width="1.25" marker-end="url(#players-ar-edge)"/><path d="M 665 116 L 665 186" fill="none" stroke="#b5482f" stroke-width="1.5" marker-end="url(#players-ar-c2)"/><text x="672" y="150" font-size="11.5" fill="#b5482f">energy bill</text><path d="M 586 230 L 474 230" fill="none" stroke="#b5482f" stroke-width="1.5" marker-end="url(#players-ar-c2)"/><text x="530" y="222" font-size="11.5" text-anchor="middle" fill="#b5482f">network charges</text><path d="M 640 246 L 640 328 L 474 328" fill="none" stroke="#2e7d5b" stroke-width="1.5" marker-end="url(#players-ar-c3)"/><text x="560" y="320" font-size="11.5" text-anchor="middle" fill="#2e7d5b">flexibility</text><path d="M 385 300 L 385 250" fill="none" stroke="#2e7d5b" stroke-width="1.5" marker-end="url(#players-ar-c3)"/><text x="392" y="280" font-size="11.5" fill="#2e7d5b">congestion services</text><path d="M 296 328 L 99 328 L 99 250" fill="none" stroke="#2e7d5b" stroke-width="1.5" marker-end="url(#players-ar-c3)"/><text x="110" y="318" font-size="11.5" fill="#2e7d5b">FCR, aFRR, mFRR</text><path d="M 174 218 L 296 218" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="235" y="210" font-size="11.5" text-anchor="middle" fill="#5a5a5a">coordinate</text><text x="24" y="374" font-size="11.5" fill="#5a5a5a" font-style="italic">Simplified. Red: what the site pays. Green: where flexibility can be sold, directly or via an aggregator or supplier.</text></svg>