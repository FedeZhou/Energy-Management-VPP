<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="TeX Gyre Heros, Helvetica, Arial, sans-serif" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1d1d1d">The equivalent circuit model: a voltage source plus resistances</text><circle cx="110" cy="160" r="26" fill="#1f3a5f" fill-opacity="0.12" stroke="#1f3a5f" stroke-width="2"/><text x="110" y="165" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">OCV</text><text x="110" y="212" font-size="11.5" text-anchor="middle" fill="#5a5a5a">depends on SoC</text><text x="110" y="228" font-size="11.5" text-anchor="middle" fill="#5a5a5a">and temperature</text><path d="M 110 134 L 110 100 L 190 100" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="190" y="90" width="70" height="20" rx="2" fill="none" stroke="#6b7280" stroke-width="1.25"/><text x="225" y="80" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">R₀</text><text x="225" y="128" font-size="11.5" text-anchor="middle" fill="#5a5a5a">instant drop</text><path d="M 260 100 L 320 100" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M 320 70 L 320 130" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M 440 70 L 440 130" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="345" y="60" width="70" height="20" rx="2" fill="none" stroke="#6b7280" stroke-width="1.25"/><path d="M 320 70 L 345 70 M 415 70 L 440 70" fill="none" stroke="#6b7280" stroke-width="1.5"/><path d="M 320 130 L 372 130 M 372 118 L 372 142 M 388 118 L 388 142 M 388 130 L 440 130" fill="none" stroke="#6b7280" stroke-width="1.5"/><text x="380" y="52" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">R₁</text><text x="380" y="162" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d1d1d">C₁</text><text x="380" y="182" font-size="11.5" text-anchor="middle" fill="#5a5a5a">slow relaxation (seconds to minutes)</text><path d="M 440 100 L 540 100" fill="none" stroke="#6b7280" stroke-width="1.5"/><circle cx="546" cy="100" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/><text x="560" y="104" font-size="12" fill="#1d1d1d">+  terminal</text><path d="M 110 186 L 110 200 L 540 200" fill="none" stroke="#6b7280" stroke-width="1.5"/><circle cx="546" cy="200" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/><text x="560" y="204" font-size="12" fill="#1d1d1d">−  terminal</text><text x="560" y="148" font-size="13" font-weight="600" fill="#1d1d1d">V = OCV(SoC) − I·R₀ − V₁</text><text x="560" y="166" font-size="11.5" fill="#5a5a5a">(I &gt; 0 on discharge)</text><text x="24" y="275" font-size="11.5" fill="#5a5a5a" font-style="italic">More RC branches add accuracy; all parameters drift with SoC, temperature and age.</text></svg>