# Operate example: a shared residential garage with eight chargers on one connection.
# Data: eight real users of the same Norwegian garage (SINTEF, location ASK), measured German
# apartment loads (OPSD home 6, scaled x 8 as a stand-in for eight flats), German 15-minute prices.
# Sizes (8 flats, 8 x 11 kW chargers, 3 x 63 A fuse) are example choices, not sourced.
# Chargers alternate phases so single-phase cars spread over L1-L3.
label: Shared garage, 8 chargers on one fuse (15-min)
description: >-
  Eight flats and eight 11 kW chargers behind one 3 x 63 A connection, two winter days. Cars are
  real users of one Norwegian garage. Charging is moved to the cheapest hours before departure.
site:
  name: Shared garage (15-min)
  mode: operate
  start: 2026-01-12
  days: 2
  step_minutes: 15
  grid: {fuse_a: 63}
  # Price adder: Eurostat 2025 German household network costs (0.1130) + taxes incl. VAT (0.1241) =
  # 0.2371 EUR/kWh (nrg_pc_204_c, band DC). Spot + adder approximates a dynamic tariff without supplier margin.
  tariff: {price_profile: ec/de_lu_da, price_adder: 0.2371}
  controller: {battery: idle, ev: cheapest_hours}
  assets:
    - {type: building, id: flats, name: Eight flats, load_profile: opsd/residential6, scale: 8, ui: {x: 80, y: 40}}
    - {type: ev_charger, id: c1, name: Spot 53, sessions: sintef/ASK_Plass53, phase: L1, ui: {x: 640, y: 0}}
    - {type: ev_charger, id: c2, name: Spot 65, sessions: sintef/ASK_Plass65, phase: L2, ui: {x: 640, y: 120}}
    - {type: ev_charger, id: c3, name: Spot 67, sessions: sintef/ASK_Plass67, phase: L3, ui: {x: 640, y: 240}}
    - {type: ev_charger, id: c4, name: Spot 29, sessions: sintef/ASK_Plass29, phase: L1, ui: {x: 640, y: 360}}
    - {type: ev_charger, id: c5, name: Spot 57, sessions: sintef/ASK_Plass57, phase: L2, ui: {x: 900, y: 0}}
    - {type: ev_charger, id: c6, name: Spot 7, sessions: sintef/ASK_Plass7, phase: L3, ui: {x: 900, y: 120}}
    - {type: ev_charger, id: c7, name: Spot 23, sessions: sintef/ASK_Plass23, phase: L1, ui: {x: 900, y: 240}}
    - {type: ev_charger, id: c8, name: Spot 89, sessions: sintef/ASK_Plass89, phase: L2, ui: {x: 900, y: 360}}
