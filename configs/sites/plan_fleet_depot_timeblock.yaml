    - {type: ev_charger, id: c8, name: "Charger 4 B", sessions: leeds/1324-04b, max_power_kw: 7.4, phases: 1, phase: L2, ui: {x: 1020, y: 80}}
    - {type: ev_charger, id: c9, name: "Charger 5 A", sessions: leeds/1324-05a, max_power_kw: 7.4, phases: 1, phase: L3, ui: {x: 1020, y: 200}}
    - {type: ev_charger, id: c10, name: "Charger 5 B", sessions: leeds/1324-05b, max_power_kw: 7.4, phases: 1, phase: L1, ui: {x: 1020, y: 320}}
    - {type: ev_charger, id: c11, name: "Charger 6 A", sessions: leeds/1324-06a, max_power_kw: 7.4, phases: 1, phase: L2, ui: {x: 1020, y: 440}}
