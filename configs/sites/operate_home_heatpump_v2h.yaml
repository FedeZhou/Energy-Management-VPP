# Operate example: the same kind of German home in a January week, with a heat pump, a bidirectional wallbox
# and the time-variable network fee (§14a Modul 3).
# Data: measured home load (OPSD home 3: its sub-meters list a heating circulation pump but no heat pump, so the
# heat pump below is not double-counted), solar modelled from Konstanz weather (Open-Meteo + pvlib), measured
# Norwegian EV sessions (SINTEF, garage ASK spot 7), German 15-minute day-ahead prices (Energy-Charts / SMARD),
# heat demand and COP from When2Heat (Germany, single-family house, air-source heat pump with radiators), and the
# Netzgesellschaft Düsseldorf 2026 Modul 3 network fee. See each profile's source in the app.
# Equipment sizes (8 kWp, 10 kWh / 5 kW battery, 11 kW bidirectional wallbox, 6 kW heat pump with a 14 kWh tank,
# 3 x 25 A fuse) are example choices, not sourced. Annual heat demand: the model default (Heizspiegel 2025).
label: Home with heat pump and bidirectional EV (15-min)
description: >-
  A German home in January with solar, a battery, a 6 kW air-source heat pump with a hot-water tank that pre-heats
  in cheap hours, and a bidirectional wallbox that lets the car cover dear evening hours. Network fees vary by time
  of day (§14a Modul 3). One week, 15-minute steps.
site:
  name: Home with heat pump and V2H (15-min)
  mode: operate
  start: 2026-01-12
  days: 7
  step_minutes: 15
  grid: {fuse_a: 25}
  # Price adder: Eurostat 2025 German household taxes incl. VAT (0.1241 EUR/kWh, nrg_pc_204_c, band DC) + supplier
  # margin 0.02975 (2.50 ct/kWh net, Stadtwerke Witten dynamic tariff price sheet, June 2026) = 0.15385. The network
  # part comes from the time-variable fee profile instead (Düsseldorf 2026, net of VAT), so it is not in the adder.
  # Export: EEG feed-in tariff for a new rooftop system up to 10 kWp with partial feed-in, commissioned
  # 1 Aug 2025 - 31 Jan 2026: 7.86 ct/kWh (Bundesnetzagentur, VergSaetzeAug25bisJan26.xlsx, "Teileinspeisung").
  # No pay while the spot price is negative (§ 51 EEG): applies once a smart meter is fitted (§ 41a EnWG).
  tariff: {price_profile: ec/de_lu_da, price_adder: 0.15385, network_fee_profile: netfee/de_duesseldorf_2026,
           export_price: 0.0786, export_unpaid_at_negative_prices: true}
  controller: {battery: self_consumption, ev: cheapest_hours, heat_pump: cheap_hours, ev_discharge: high_prices}
  assets:
    - {type: building, id: home, name: Home, load_profile: opsd/residential3, ui: {x: 420, y: 40}}
    - {type: heat_pump, id: heatpump, name: Heat pump, max_power_kw: 6, buffer_kwh: 14, ui: {x: 740, y: 40}}
    - {type: pv, id: pv, name: Rooftop solar, capacity_kwp: 8, profile: om/konstanz_south30, ui: {x: 100, y: 40}}
    - {type: battery, id: battery, name: Home battery, capacity_kwh: 10, power_kw: 5, ui: {x: 100, y: 380}}
    - {type: ev_charger, id: charger, name: Wallbox, sessions: sintef/ASK_Plass7, phases: 3, bidirectional: true,
       ui: {x: 420, y: 380}}
